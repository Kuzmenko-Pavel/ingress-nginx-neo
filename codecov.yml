#
# Codecov: a comment with the coverage diff and the failed tests on every pull
# request, and a status check that fails when the project coverage drops by
# more than 1%. CI uploads the reports of dist/test-reports (see
# docs/developer-guide/ci.md).
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        informational: true
comment:
  layout: "diff, flags, files"
  # Codecov shows only the coverage of the changed lines by default; the
  # comment also shows the change of the project coverage against the base.
  hide_project_coverage: false
