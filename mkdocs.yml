site_name: ingress-nginx-neo
site_description: NGINX Ingress controller for Kubernetes
site_url: https://kuzmenko-pavel.github.io/ingress-nginx-neo/
repo_name: Kuzmenko-Pavel/ingress-nginx-neo
repo_url: https://github.com/Kuzmenko-Pavel/ingress-nginx-neo
edit_uri: edit/main/docs/

exclude_docs: |
  requirements.txt

# Extensions
markdown_extensions:
  - admonition
  - abbr
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc:
      # insert a blank space before the character
      permalink: " ¶"
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.sections
    - content.code.copy

  palette:
    primary: "teal"
    accent: "green"

plugins:
  - search

extra:
  version:
    provider: mike
    default: stable

extra_css: [extra.css]

nav:
  - Home: "index.md"
  - Deploy:
      - Installation: "deploy/index.md"
      - Bare-metal considerations: "deploy/baremetal.md"
      - Role Based Access Control (RBAC): "deploy/rbac.md"
      - Hardening guide: "deploy/hardening-guide.md"
      - Upgrade: "deploy/upgrade.md"
      - Migrate from kubernetes/ingress-nginx: "deploy/migrate.md"
      - Artifacts and verification: "deploy/artifacts.md"
  - User guide:
      - How it works: "how-it-works.md"
      - NGINX Configuration:
          - Introduction: "user-guide/nginx-configuration/index.md"
          - Basic usage: "user-guide/basic-usage.md"
          - Annotations: "user-guide/nginx-configuration/annotations.md"
          - Annotations Risks: "user-guide/nginx-configuration/annotations-risk.md"
          - ConfigMap: "user-guide/nginx-configuration/configmap.md"
          - Custom NGINX template: "user-guide/nginx-configuration/custom-template.md"
          - Log format: "user-guide/nginx-configuration/log-format.md"
      - Command line arguments: "user-guide/cli-arguments.md"
      - Custom errors: "user-guide/custom-errors.md"
