suite: Controller > Secret
templates:
  - controller-secret.yaml

tests:
  - it: should not create a Secret if `dhParam` is empty
    asserts:
      - hasDocuments:
          count: 0

  - it: should create a Secret with the DH parameters of `dhParam`
    set:
      dhParam: ZGhwYXJhbQ==
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ingress-nginx-neo-controller
      - equal:
          path: data["dhparam.pem"]
          value: ZGhwYXJhbQ==
