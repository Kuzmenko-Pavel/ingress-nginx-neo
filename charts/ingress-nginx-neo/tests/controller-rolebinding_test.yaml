suite: Controller > RoleBinding
templates:
  - controller-rolebinding.yaml

tests:
  - it: should bind the Role of the release to the ServiceAccount of the controller
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: RoleBinding
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ingress-nginx-neo
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: RELEASE-NAME-ingress-nginx-neo
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: RELEASE-NAME-ingress-nginx-neo
              namespace: NAMESPACE

  - it: should not create a RoleBinding if `rbac.create` is false
    set:
      rbac.create: false
    asserts:
      - hasDocuments:
          count: 0
