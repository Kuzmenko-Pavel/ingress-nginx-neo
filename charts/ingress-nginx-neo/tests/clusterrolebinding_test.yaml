suite: ClusterRoleBinding
templates:
  - clusterrolebinding.yaml

tests:
  - it: should bind the ClusterRole of the release to the ServiceAccount of the controller
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ingress-nginx-neo
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: RELEASE-NAME-ingress-nginx-neo
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: RELEASE-NAME-ingress-nginx-neo
              namespace: NAMESPACE

  - it: should not create a ClusterRoleBinding if `rbac.create` is false
    set:
      rbac.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create a ClusterRoleBinding if `rbac.scope` is true
    set:
      rbac.scope: true
      controller.scope.enabled: true
    asserts:
      - hasDocuments:
          count: 0
