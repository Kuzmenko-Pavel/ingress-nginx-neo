suite: Controller > ConfigMap > UDP
templates:
  - controller-configmap-udp.yaml

tests:
  - it: should not create a ConfigMap if `udp` is empty
    asserts:
      - hasDocuments:
          count: 0

  - it: should create a ConfigMap with the services of `udp`
    set:
      udp:
        "53": kube-system/kube-dns:53
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ingress-nginx-neo-udp
      - equal:
          path: data
          value:
            "53": kube-system/kube-dns:53

  - it: should create a ConfigMap with annotations if `controller.udp.annotations` is set
    set:
      udp:
        "53": kube-system/kube-dns:53
      controller.udp.annotations:
        example.com/owner: dns
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: dns
