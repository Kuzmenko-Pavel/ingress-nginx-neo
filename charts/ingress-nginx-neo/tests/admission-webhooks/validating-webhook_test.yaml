suite: Admission Webhooks > ValidatingWebhookConfiguration
templates:
  - admission-webhooks/validating-webhook.yaml

tests:
  - it: should not create a ValidatingWebhookConfiguration if `controller.admissionWebhooks.enabled` is false
    set:
      controller.admissionWebhooks.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should create a ValidatingWebhookConfiguration if `controller.admissionWebhooks.enabled` is true
    set:
      controller.admissionWebhooks.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ValidatingWebhookConfiguration
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ingress-nginx-neo-admission

  - it: should create a ValidatingWebhookConfiguration with a custom port if `controller.admissionWebhooks.service.servicePort` is set
    set:
      controller.admissionWebhooks.enabled: true
      controller.admissionWebhooks.service.servicePort: 9443
    asserts:
      - equal:
          path: webhooks[0].clientConfig.service.port
          value: 9443

  - it: should call the webhook for every Ingress if `controller.admissionWebhooks.matchIngressClass` is false
    asserts:
      - notExists:
          path: webhooks[0].matchConditions

  - it: should call the webhook only for Ingresses of the release's class if `controller.admissionWebhooks.matchIngressClass` is true
    set:
      controller.admissionWebhooks.matchIngressClass: true
    asserts:
      - equal:
          path: webhooks[0].matchConditions
          value:
            - name: ingress-class
              expression: >-
                has(object.spec.ingressClassName)
                ? object.spec.ingressClassName in ["nginx"]
                : (has(object.metadata.annotations) && 'kubernetes.io/ingress.class' in object.metadata.annotations)
                ? object.metadata.annotations['kubernetes.io/ingress.class'] == "nginx"
                : false

  - it: should match the aliases, the annotation class and Ingresses without a class as the controller does
    set:
      controller.admissionWebhooks.matchIngressClass: true
      controller.ingressClassResource.name: internal
      controller.ingressClassResource.aliases:
        - internal-a
        - internal-b
      controller.ingressClass: internal-legacy
      controller.watchIngressWithoutClass: true
    asserts:
      - matchRegex:
          path: webhooks[0].matchConditions[0].expression
          pattern: 'object\.spec\.ingressClassName in \["internal","internal-a","internal-b"\]'
      - matchRegex:
          path: webhooks[0].matchConditions[0].expression
          pattern: "\\['kubernetes.io/ingress.class'\\] == \"internal-legacy\""
      - matchRegex:
          path: webhooks[0].matchConditions[0].expression
          pattern: ': true$'

  - it: should match the IngressClass named after `controller.ingressClass` if `controller.ingressClassByName` is true
    set:
      controller.admissionWebhooks.matchIngressClass: true
      controller.ingressClassByName: true
      controller.ingressClass: internal-legacy
    asserts:
      - matchRegex:
          path: webhooks[0].matchConditions[0].expression
          pattern: 'object\.spec\.ingressClassName in \["nginx","internal-legacy"\]'
