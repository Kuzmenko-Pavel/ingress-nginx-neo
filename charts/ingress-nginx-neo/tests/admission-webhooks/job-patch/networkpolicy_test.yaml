suite: Admission Webhooks > Patch Job > NetworkPolicy
templates:
  - admission-webhooks/job-patch/networkpolicy.yaml

tests:
  - it: should not create a NetworkPolicy if `controller.admissionWebhooks.patch.networkPolicy.enabled` is false
    asserts:
      - hasDocuments:
          count: 0

  - it: should create a NetworkPolicy of the patch jobs that allows them to reach the API server
    set:
      controller.admissionWebhooks.patch.networkPolicy.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ingress-nginx-neo-admission
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: admission-webhook
      - equal:
          path: spec.egress
          value:
            - {}

  - it: should not create a NetworkPolicy if `controller.admissionWebhooks.certManager.enabled` is true
    set:
      controller.admissionWebhooks.patch.networkPolicy.enabled: true
      controller.admissionWebhooks.certManager.enabled: true
    asserts:
      - hasDocuments:
          count: 0
