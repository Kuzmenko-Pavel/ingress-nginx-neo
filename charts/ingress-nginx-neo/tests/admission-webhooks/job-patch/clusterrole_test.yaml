suite: Admission Webhooks > Patch Job > ClusterRole
templates:
  - admission-webhooks/job-patch/clusterrole.yaml

tests:
  - it: should not create a ClusterRole if `controller.admissionWebhooks.patch.rbac.create` is false
    set:
      controller.admissionWebhooks.patch.rbac.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should allow the patch job to read and update only the ValidatingWebhookConfiguration of the release
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups:
                - admissionregistration.k8s.io
              resources:
                - validatingwebhookconfigurations
              resourceNames:
                - RELEASE-NAME-ingress-nginx-neo-admission
              verbs:
                - get
                - update
