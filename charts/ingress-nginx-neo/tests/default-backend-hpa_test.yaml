suite: Default Backend > HPA
templates:
  - default-backend-hpa.yaml

tests:
  - it: should not create an HPA if `defaultBackend.autoscaling.enabled` is false
    set:
      defaultBackend.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create an HPA if `defaultBackend.enabled` is false
    set:
      defaultBackend.autoscaling.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should create an HPA that scales the Deployment of the default backend
    set:
      defaultBackend.enabled: true
      defaultBackend.autoscaling.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: HorizontalPodAutoscaler
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ingress-nginx-neo-defaultbackend
      - equal:
          path: spec.scaleTargetRef
          value:
            apiVersion: apps/v1
            kind: Deployment
            name: RELEASE-NAME-ingress-nginx-neo-defaultbackend
      - equal:
          path: spec.minReplicas
          value: 1
      - equal:
          path: spec.maxReplicas
          value: 2
