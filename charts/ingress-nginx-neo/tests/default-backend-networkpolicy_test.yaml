suite: Default Backend > NetworkPolicy
templates:
  - default-backend-networkpolicy.yaml

tests:
  - it: should not create a NetworkPolicy if `defaultBackend.networkPolicy.enabled` is false
    set:
      defaultBackend.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should create a NetworkPolicy that allows only the port of the default backend
    set:
      defaultBackend.enabled: true
      defaultBackend.networkPolicy.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ingress-nginx-neo-defaultbackend
      - equal:
          path: spec.podSelector.matchLabels["app.kubernetes.io/component"]
          value: default-backend
      - equal:
          path: spec.ingress
          value:
            - ports:
                - protocol: TCP
                  port: 8080
