apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    k8s-app: vouch-proxy
  name: vouch-proxy
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: vouch-proxy
  template:
    metadata:
      labels:
        k8s-app: vouch-proxy
    spec:
      containers:
      - env:
        - name: VOUCH_ALLOWALLUSERS
          value: "true"
        # Recommended: remove VOUCH_ALLOWALLUSERS and set an allowlist
        # - name: VOUCH_WHITELIST
        #   value: alice,bob
        - name: VOUCH_COOKIE_DOMAIN
          value: <Ingress Host>
        - name: VOUCH_LISTEN
          value: 0.0.0.0
        - name: VOUCH_DOCUMENT_ROOT
          value: oauth2
        # See https://github.com/vouch/vouch-proxy/tree/master/config for different provider examples
        - name: OAUTH_PROVIDER
          value: github
        - name: OAUTH_CLIENT_ID
          value: <Client ID>
        - name: OAUTH_CLIENT_SECRET
          value: <Client Secret>
        image: quay.io/vouch/vouch-proxy:0.45.1@sha256:c0298d3133183b87deb0129fa65ee07c423f57c256ca7e3d49eec7e3e77fa01d
        name: vouch-proxy
        ports:
        - containerPort: 9090
          protocol: TCP

---

apiVersion: v1
kind: Service
metadata:
  labels:
    k8s-app: vouch-proxy
  name: vouch-proxy
  namespace: default
spec:
  ports:
  - name: http
    port: 9090
    protocol: TCP
    targetPort: 9090
  selector:
    k8s-app: vouch-proxy

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vouch-proxy
  namespace: default
spec:
  ingressClassName: nginx
  rules:
  - host: __INGRESS_HOST__
    http:
      paths:
      - path: /oauth2
        pathType: Prefix
        backend:
          service:
            name: vouch-proxy
            port:
              number: 9090
  tls:
  - hosts:
    - __INGRESS_HOST__
    secretName: __INGRESS_SECRET__

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/auth-url: "https://$host/oauth2/validate"
    nginx.ingress.kubernetes.io/auth-signin: "https://$host/oauth2/login?url=$scheme://$http_host$request_uri"
  name: external-auth-oauth2
  namespace: default
spec:
  ingressClassName: nginx
  rules:
  - host: __INGRESS_HOST__
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            # This assumes http-svc exists, see
            # https://kuzmenko-pavel.github.io/ingress-nginx-neo/examples/PREREQUISITES/#test-http-service
            name: http-svc
            port:
              number: 80
  tls:
  - hosts:
    - __INGRESS_HOST__
    secretName: __INGRESS_SECRET__
