# SPDX-License-Identifier: Apache-2.0
#
# Backends of `make test-load`. tools/load-test.sh replaces ECHO_IMAGE and
# HTTPBUN_IMAGE with the src-* images of this tree.
#
# - load.local: e2e-test-echo (NGINX with Lua), faster than the controller,
#   so that the controller is the measured component.
# - errors.load.local: httpbun answers /status/<code>; the controller
#   intercepts 404 and 503 and serves the page of the default backend
#   (custom-error-pages).
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-nginx-neo-load
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: ingress-nginx-neo-load
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: echo
          image: ECHO_IMAGE
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: ingress-nginx-neo-load
spec:
  selector:
    app: echo
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echo
  namespace: ingress-nginx-neo-load
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - load.local
  rules:
    - host: load.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo
                port:
                  number: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbun
  namespace: ingress-nginx-neo-load
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbun
  template:
    metadata:
      labels:
        app: httpbun
    spec:
      containers:
        - name: httpbun
          image: HTTPBUN_IMAGE
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /get
              port: 80
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: httpbun
  namespace: ingress-nginx-neo-load
spec:
  selector:
    app: httpbun
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: errors
  namespace: ingress-nginx-neo-load
  annotations:
    nginx.ingress.kubernetes.io/custom-http-errors: "404,503"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - errors.load.local
  rules:
    - host: errors.load.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: httpbun
                port:
                  number: 80
