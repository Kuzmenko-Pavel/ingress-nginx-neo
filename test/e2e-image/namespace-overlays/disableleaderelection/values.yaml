# TODO: remove the need to use fullnameOverride
fullnameOverride: nginx-ingress
controller:
  scope:
    # Necessary to allow the ingress controller to get the topology information from the nodes
    enabled: false
  config:
    worker-processes: "1"
  readinessProbe:
    initialDelaySeconds: 3
    periodSeconds: 1
  livenessProbe:
    initialDelaySeconds: 3
    periodSeconds: 1
  service:
    type: NodePort
  extraArgs:
    # e2e tests do not require information about ingress status
    update-status: "false"
    # sync right after a change instead of the default 0.3 syncs per second,
    # so that the framework waits for a sync and not for the rate limit
    sync-rate-limit: "10"
  terminationGracePeriodSeconds: 1
  admissionWebhooks:
    enabled: false

  disableLeaderElection: true

rbac:
  create: true
  scope: false
