# auth-keepalive-* keep connections to the external authentication, which needs HTTP/2 off
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proxy.foo.com
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/auth-url: "http://auth.default.svc.cluster.local/verify"
    nginx.ingress.kubernetes.io/auth-keepalive: "10"
    nginx.ingress.kubernetes.io/auth-keepalive-requests: "100"
    nginx.ingress.kubernetes.io/auth-keepalive-timeout: "30"
    nginx.ingress.kubernetes.io/auth-keepalive-share-vars: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: proxy.foo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo
                port:
                  number: 80
