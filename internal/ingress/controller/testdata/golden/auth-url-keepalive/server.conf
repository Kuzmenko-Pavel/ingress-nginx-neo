## start server proxy.foo.com
	server {
		server_name "proxy.foo.com" ;
		listen 80  ;
		listen 443  ssl;
		set $proxy_upstream_name "-";
		ssl_certificate_by_lua_file /etc/nginx/lua/nginx/ngx_conf_certificate.lua;
		location = /_external-auth-Lw-Prefix {
			internal;
			access_log off;
			# Ensure that modsecurity will not run on an internal location as this is not accessible from outside
			# ngx_auth_request module overrides variables in the parent request,
			# therefore we have to explicitly set this variable again so that when the parent request
			# resumes it has the correct value set for this variable so that Lua can pick backend correctly
			set $proxy_upstream_name "default-echo-80";
			proxy_intercept_errors      off;
			proxy_pass_request_body     off;
			proxy_set_header            Content-Length          "";
			proxy_set_header            X-Forwarded-Proto       "";
			proxy_set_header            X-Request-ID            $req_id;
			proxy_set_header            Host                    auth.default.svc.cluster.local;
			proxy_set_header            X-Original-URL          $scheme://$http_host$request_uri;
			proxy_set_header            X-Original-Method       $request_method;
			proxy_set_header            X-Sent-From             "nginx-ingress-controller";
			proxy_set_header            X-Real-IP               $remote_addr;
			proxy_set_header            X-Forwarded-For        $remote_addr;
			proxy_set_header            X-Auth-Request-Redirect $request_uri;
			proxy_buffering                         off;
			proxy_buffer_size                       4k;
			proxy_buffers                           4 4k;
			proxy_request_buffering                 on;
			proxy_ssl_server_name       on;
			proxy_pass_request_headers  on;
			client_max_body_size        1m;
			# Pass the extracted client certificate to the auth provider
			# The target is an upstream with HTTP keepalive, that is why the
			# Connection header is cleared and the HTTP version is set to 1.1 as
			# the Nginx documentation suggests:
			# https://nginx.org/en/docs/http/ngx_http_upstream_module.html#keepalive
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			set $target http://proxy.foo.com-external-auth-Lw-Prefix/verify;
			proxy_pass $target;
		}
		location "/" {
			set $namespace      "default";
			set $ingress_name   "proxy.foo.com";
			set $service_name   "echo";
			set $service_port   "80";
			set $location_path  "/";
			set $force_ssl_redirect "false";
			set $ssl_redirect "true";
			set $force_no_ssl_redirect "false";
			set $preserve_trailing_slash "false";
			set $use_port_in_redirects "false";
			rewrite_by_lua_file /etc/nginx/lua/nginx/ngx_rewrite.lua;
			header_filter_by_lua_file /etc/nginx/lua/nginx/ngx_conf_srv_hdr_filter.lua;
			log_by_lua_file /etc/nginx/lua/nginx/ngx_conf_log_block.lua;
			port_in_redirect off;
			set $balancer_ewma_score -1;
			set $proxy_upstream_name "default-echo-80";
			set $proxy_host          $proxy_upstream_name;
			set $pass_access_scheme  $scheme;
			set $pass_server_port    $server_port;
			set $best_http_host      $http_host;
			set $pass_port           $pass_server_port;
			set $proxy_alternative_upstream_name "";
			# this location requires authentication
			set $auth_cookie '';
			add_header Set-Cookie $auth_cookie;
			# `auth_request` module does not support HTTP keepalives in upstream block:
			# https://trac.nginx.org/nginx/ticket/1579
			set $auth_path '/_external-auth-Lw-Prefix';
			set $auth_keepalive_share_vars true;
			set $auth_response_headers '';
			access_by_lua_file /etc/nginx/lua/nginx/ngx_conf_external_auth.lua;
			client_max_body_size                    1m;
			proxy_set_header Host                   $best_http_host;
			# Pass the extracted client certificate to the backend
			# Allow websocket connections
			proxy_set_header                        Upgrade           $http_upgrade;
			proxy_set_header                        Connection        $connection_upgrade;
			proxy_set_header X-Request-ID           $req_id;
			proxy_set_header X-Real-IP              $remote_addr;
			proxy_set_header X-Forwarded-For        $remote_addr;
			proxy_set_header X-Forwarded-Host       $best_http_host;
			proxy_set_header X-Forwarded-Port       $pass_port;
			proxy_set_header X-Forwarded-Proto      $pass_access_scheme;
			proxy_set_header X-Forwarded-Scheme     $pass_access_scheme;
			proxy_set_header X-Scheme               $pass_access_scheme;
			# Pass the original X-Forwarded-For
			proxy_set_header X-Original-Forwarded-For  $http_x_forwarded_for;
			# Pass the original X-Forwarded-Host
			proxy_set_header X-Original-Forwarded-Host $http_x_forwarded_host;
			# mitigate HTTPoxy Vulnerability
			# https://www.nginx.com/blog/mitigating-the-httpoxy-vulnerability-with-nginx/
			proxy_set_header Proxy                  "";
			# Custom headers to proxied server
			proxy_connect_timeout                   5s;
			proxy_send_timeout                      60s;
			proxy_read_timeout                      60s;
			proxy_buffering                         off;
			proxy_buffer_size                       4k;
			proxy_buffers                           4 4k;
			proxy_max_temp_file_size                1024m;
			proxy_request_buffering                 on;
			proxy_http_version                      1.1;
			proxy_cookie_domain                     off;
			proxy_cookie_path                       off;
			# In case of errors try the next upstream server before returning an error
			proxy_next_upstream                     error timeout;
			proxy_next_upstream_timeout             0;
			proxy_next_upstream_tries               3;
			# Custom Response Headers
			proxy_pass http://upstream_balancer;
			proxy_redirect                          off;
		}
	}
	## end server proxy.foo.com
## outside of the server blocks (+ added, - removed by the Ingress)
+	## start auth upstream proxy.foo.com
+	upstream proxy.foo.com-external-auth-Lw-Prefix {
+		server auth.default.svc.cluster.local;
+		keepalive 10;
+		keepalive_requests 100;
+		keepalive_timeout 30s;
+	}
+	## end auth upstream proxy.foo.com
