# ssl-ciphers and ssl-prefer-server-ciphers set the ciphers of the TLS host
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proxy.foo.com
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/ssl-ciphers: "ECDHE-RSA-AES128-GCM-SHA256"
    nginx.ingress.kubernetes.io/ssl-prefer-server-ciphers: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - proxy.foo.com
      secretName: proxy.foo.com
  rules:
    - host: proxy.foo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo
                port:
                  number: 80
