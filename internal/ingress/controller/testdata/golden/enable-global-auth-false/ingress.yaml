# enable-global-auth false turns the global-auth-url off
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proxy.foo.com
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/enable-global-auth: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: proxy.foo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo
                port:
                  number: 80
