# proxy-max-temp-file-size sets proxy_max_temp_file_size
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proxy.foo.com
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/proxy-max-temp-file-size: "2048m"
spec:
  ingressClassName: nginx
  rules:
    - host: proxy.foo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo
                port:
                  number: 80
