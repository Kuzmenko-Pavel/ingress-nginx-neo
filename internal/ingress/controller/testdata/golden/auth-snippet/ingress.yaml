# auth-snippet goes into the location of the external authentication
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proxy.foo.com
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/auth-url: "http://auth.default.svc.cluster.local/verify"
    nginx.ingress.kubernetes.io/auth-snippet: "proxy_set_header X-Golden \"auth\";"
spec:
  ingressClassName: nginx
  rules:
    - host: proxy.foo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo
                port:
                  number: 80
