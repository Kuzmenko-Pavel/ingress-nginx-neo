# denylist-source-range denies the ranges
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proxy.foo.com
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/denylist-source-range: "10.0.0.0/24, 192.168.1.1"
spec:
  ingressClassName: nginx
  rules:
    - host: proxy.foo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo
                port:
                  number: 80
