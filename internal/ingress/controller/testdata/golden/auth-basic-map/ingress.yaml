# auth-secret-type auth-map with a user per key of the Secret
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proxy.foo.com
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/auth-type: "basic"
    nginx.ingress.kubernetes.io/auth-secret: "basic-auth-map"
    nginx.ingress.kubernetes.io/auth-secret-type: "auth-map"
spec:
  ingressClassName: nginx
  rules:
    - host: proxy.foo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo
                port:
                  number: 80
---
apiVersion: v1
kind: Secret
metadata:
  name: basic-auth-map
  namespace: default
data:
  # $apr1$wIRBwzEo$Y6DXt8xYeLCwh9wFNxjhD.
  foo: JGFwcjEkd0lSQnd6RW8kWTZEWHQ4eFllTEN3aDl3Rk54amhELg==
