# The e2e spec "proxy-* should set proxy_redirect to hello.com goodbye.com" (test/e2e/annotations/proxy.go)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proxy.foo.com
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/proxy-redirect-from: "hello.com"
    nginx.ingress.kubernetes.io/proxy-redirect-to: "goodbye.com"
spec:
  ingressClassName: nginx
  rules:
    - host: proxy.foo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo
                port:
                  number: 80
