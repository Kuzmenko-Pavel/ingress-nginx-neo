# auth-type basic with the users of an auth-file Secret
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proxy.foo.com
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/auth-type: "basic"
    nginx.ingress.kubernetes.io/auth-secret: "basic-auth"
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
spec:
  ingressClassName: nginx
  rules:
    - host: proxy.foo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo
                port:
                  number: 80
---
apiVersion: v1
kind: Secret
metadata:
  name: basic-auth
  namespace: default
data:
  # foo:$apr1$wIRBwzEo$Y6DXt8xYeLCwh9wFNxjhD.
  auth: Zm9vOiRhcHIxJHdJUkJ3ekVvJFk2RFh0OHhZZUxDd2g5d0ZOeGpoRC4=
