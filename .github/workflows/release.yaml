# SPDX-License-Identifier: Apache-2.0
#
# Release a signed vX.Y.Z tag: verify the tag and the tested commit, publish
# the dependency images, then (after approval of the release environment)
# rebuild, publish and sign the delivered images, the chart, the plugin and
# the static manifests into a draft GitHub Release, publish the docs version
# and finally the release. A failed run can be re-run: it resumes from the
# draft release.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/**/go.sum', 'tools/**/go.mod', 'tools/versions.env', 'go.mod') }}

      - name: Verify the release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: make release-verify RELEASE_TAG=${{ github.ref_name }}

  deps:
    name: Dependency images
    needs: verify
    uses: ./.github/workflows/deps.yaml
    permissions:
      contents: read
      packages: write
    with:
      publish: true

  publish:
    name: Publish
    needs: deps
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Cache tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/**/go.sum', 'tools/**/go.mod', 'tools/versions.env', 'go.mod') }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and sign images
        run: make publish-guard docker-publish docker-promote docker-sign CHANNEL=release DOCKER_CACHE=gha

      - name: Build and sign the kubectl plugin
        run: make code-build-plugin code-sign-plugin CHANNEL=release

      - name: Publish the chart, manifests and the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: make helm-package helm-publish manifests-generate release-notes release-publish CHANNEL=release

  docs:
    name: Publish docs
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Publish the docs version
        run: make docs-publish CHANNEL=release

  finalize:
    name: Publish release
    needs: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: make release-finalize CHANNEL=release
