# SPDX-License-Identifier: Apache-2.0
#
# Release a signed vX.Y.Z tag: verify the tag and the tested commit, publish
# the dependency images, then (after approval of the release environment)
# rebuild, publish and sign the delivered images, the chart, the plugin and
# the static manifests into a draft GitHub Release, publish the docs version
# and finally the release. A failed run can be re-run: it resumes from the
# draft release.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/**/go.sum', 'tools/**/go.mod', 'tools/versions.env', 'go.mod') }}

      - name: Verify the release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: make release-verify RELEASE_TAG=${{ github.ref_name }}

  deps:
    name: Dependency images
    needs: verify
    uses: ./.github/workflows/deps.yaml
    permissions:
      contents: read
      packages: write
    with:
      publish: true

  publish:
    name: Publish
    needs: deps
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Cache tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/**/go.sum', 'tools/**/go.mod', 'tools/versions.env', 'go.mod') }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and sign images
        run: make publish-guard docker-publish docker-promote docker-sign CHANNEL=release DOCKER_CACHE=gha

      - name: Build and sign the kubectl plugin
        run: make code-build-plugin code-sign-plugin CHANNEL=release

      - name: Publish the chart, manifests and the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: make helm-package helm-publish manifests-generate release-notes release-publish CHANNEL=release

  docs:
    name: Publish docs
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Publish the docs version
        run: make docs-publish CHANNEL=release

  finalize:
    name: Publish release
    needs: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: make release-finalize CHANNEL=release
