#### THIS IS A TEMPLATE ####
# This workflow is created to be a template for every time an e2e test is required,

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      platforms-test:
        type: string
        default: linux/amd64
      platforms-publish:
        type: string
        default: linux/amd64
      publish:
        description: 'Push the image on main when its TAG changes (false for images published by release.yaml)'
        type: boolean
        default: true

env:
  PLATFORMS: ${{ inputs.platforms-test }}

permissions:
  contents: write
  packages: write

# bash -eo pipefail: a failing command on the left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  changestag:
    permissions:
      contents: read  # for dorny/paths-filter to fetch a list of changed files
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.filter.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            tag:
              - 'images/**/TAG'

  image-build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build
        run: |
          # Images built FROM the NGINX base need it published. It is missing only between a
          # new images/nginx/TAG and its first publication by base-images.yaml, so defer the
          # build instead of failing on an image that does not exist yet.
          if grep -q 'BASE_IMAGE' "images/${{ inputs.name }}/rootfs/Dockerfile"; then
            BASE_IMAGE="$(hack/nginx-base-image.sh)"
            rc=0; hack/image-exists.sh "${BASE_IMAGE}" || rc=$?
            case ${rc} in
              0) ;;
              1) echo "::warning::${BASE_IMAGE} is not published yet; skipping the ${{ inputs.name }} build until base-images.yaml publishes it"
                 exit 0 ;;
              *) exit 1 ;;
            esac
          fi
          cd images/ && make NAME=${{ inputs.name }} build

  image-push:
    name: Push
    needs: changestag
    if: |
      (inputs.publish && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changestag.outputs.tag == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      PLATFORMS: ${{ inputs.platforms-publish }}
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Login to GitHub Container Registry
      uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push
      run: |
          cd images/ && make REGISTRY=ghcr.io/kuzmenko-pavel/ingress-nginx NAME=${{ inputs.name }} push

