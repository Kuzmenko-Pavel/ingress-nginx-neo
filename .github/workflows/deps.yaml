# SPDX-License-Identifier: Apache-2.0
#
# Dependency images of builds and tests (nginx base, test runner, e2e helpers),
# content addressed by their sources. With publish, missing src-* images are
# built natively per architecture, pushed by digest and merged into
# multi-platform indexes. Without publish (pull requests), they are pulled when
# published and built for amd64 otherwise, and handed to the caller as the
# deps-images artifact.
name: Dependency images

on:
  workflow_call:
    inputs:
      publish:
        description: Publish missing src-* images.
        type: boolean
        required: true
    outputs:
      artifact:
        description: '"true" when the deps-images artifact holds the images.'
        value: ${{ jobs.local.outputs.artifact }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      platforms: ${{ steps.plan.outputs.platforms }}
      missing: ${{ steps.plan.outputs.missing }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Plan
        id: plan
        run: |
          echo "platforms=$(make -s print-deps-platforms)" >> "$GITHUB_OUTPUT"
          echo "missing=$(make -s print-deps-missing)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.arch }})
    needs: plan
    if: inputs.publish && needs.plan.outputs.missing == 'true'
    runs-on: ${{ matrix.runner }}
    # The nginx base compiles NGINX and its modules natively.
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.platforms) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/**/go.sum', 'tools/**/go.mod', 'tools/versions.env', 'go.mod') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make docker-publish-deps PLATFORM=${{ matrix.platform }} DOCKER_CACHE=gha

      - name: Upload digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deps-digests-${{ matrix.arch }}
          path: dist/digests
          if-no-files-found: ignore
          retention-days: 1

  manifest:
    name: Publish indexes
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: deps-digests-*
          path: dist/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-platform indexes
        run: make docker-publish-deps-manifest

  local:
    name: Build for tests
    needs: plan
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: read
    outputs:
      artifact: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Pull or build
        env:
          BUILDX_BUILDER: default
          GITHUB_TOKEN: ${{ github.token }}
        run: make docker-build-deps docker-save SAVE=deps

      - name: Upload images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deps-images
          path: dist/images-deps.tar
          retention-days: 3
