# SPDX-License-Identifier: Apache-2.0
#
# Dependency images of builds and tests (nginx base, test runner, e2e helpers),
# content addressed by their sources. With publish, missing src-* images are
# built natively per architecture, pushed by digest and merged into
# multi-platform indexes. Without publish (pull requests), they are pulled when
# published and built for amd64 otherwise, and handed to the caller as the
# deps-images artifact.
name: Dependency images

on:
  workflow_call:
    inputs:
      publish:
        description: Publish missing src-* images.
        type: boolean
        required: true
    outputs:
      artifact:
        description: '"true" when the deps-images artifact holds the images.'
        value: ${{ jobs.local.outputs.artifact }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      platforms: ${{ steps.plan.outputs.platforms }}
      missing: ${{ steps.plan.outputs.missing }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Plan
        id: plan
        run: |
          echo "platforms=$(make -s print-deps-platforms)" >> "$GITHUB_OUTPUT"
          echo "missing=$(make -s print-deps-missing)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.arch }})
    needs: plan
    if: inputs.publish && needs.plan.outputs.missing == 'true'
    runs-on: ${{ matrix.runner }}
    # The nginx base compiles NGINX and its modules natively.
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.platforms) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/**/go.sum', 'tools/**/go.mod', 'tools/versions.env', 'go.mod') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make docker-publish-deps PLATFORM=${{ matrix.platform }} DOCKER_CACHE=gha

      - name: Upload digests
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: deps-digests-${{ matrix.arch }}
          path: dist/digests
          if-no-files-found: ignore
          retention-days: 1

  manifest:
    name: Publish indexes
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: deps-digests-*
          path: dist/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-platform indexes
        run: make docker-publish-deps-manifest

  local:
    name: Build for tests
    needs: plan
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: read
    outputs:
      artifact: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Pull or build
        env:
          BUILDX_BUILDER: default
          GITHUB_TOKEN: ${{ github.token }}
        run: make docker-build-deps docker-save SAVE=deps

      - name: Upload images
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: deps-images
          path: dist/images-deps.tar
          retention-days: 3
