name: Base Images

# Publishes the NGINX base image (images/nginx) and the e2e test runner (images/test-runner)
# to GHCR. Versions come from images/nginx/TAG and images/test-runner/TAG; a tag that is
# already published is never rebuilt or overwritten, so every content change needs a TAG
# bump (enforced for images/nginx by ci.yaml).
#
# Architectures: the NGINX base is published for linux/amd64 and linux/arm64 (each built on a
# native runner, no QEMU, merged into one multi-platform tag). Set the repository variable
# DISABLE_ARM64 to "true" to publish linux/amd64 only. The e2e test runner is CI tooling and
# is published for linux/amd64 only.

on:
  push:
    branches:
      - main
    paths:
      - 'images/nginx/**'
      - 'images/test-runner/**'

  workflow_dispatch:
    inputs:
      images:
        description: 'Images to publish when their tag is not published yet'
        type: choice
        options:
          - all
          - nginx
          - test-runner
        default: all
      arm64:
        description: 'Also build linux/arm64'
        type: boolean
        default: true

  workflow_call:
    inputs:
      images:
        type: string
        default: nginx
      arm64:
        type: boolean
        default: true
      ref:
        description: 'Git ref to build from (defaults to the caller ref)'
        type: string
        default: ''

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/kuzmenko-pavel/ingress-nginx

concurrency:
  group: base-images-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

# bash -eo pipefail: a failing command on the left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      nginx: ${{ steps.plan.outputs.nginx }}
      nginx-image: ${{ steps.plan.outputs.nginx-image }}
      test-runner: ${{ steps.plan.outputs.test-runner }}
      test-runner-image: ${{ steps.plan.outputs.test-runner-image }}
      platforms: ${{ steps.plan.outputs.platforms }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Plan
        id: plan
        env:
          IMAGES: ${{ inputs.images || 'all' }}
          # push: repository default; workflow_dispatch / workflow_call: the arm64 input.
          ARM64: ${{ (github.event_name == 'push' && vars.DISABLE_ARM64 != 'true') || (github.event_name != 'push' && inputs.arm64) }}
        run: |
          if [ "${ARM64}" = "true" ]; then
            PLATFORMS="linux/amd64 linux/arm64"
            MATRIX='[{"arch":"amd64","platform":"linux/amd64","runner":"ubuntu-latest"},{"arch":"arm64","platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]'
          else
            PLATFORMS="linux/amd64"
            MATRIX='[{"arch":"amd64","platform":"linux/amd64","runner":"ubuntu-latest"}]'
          fi

          NGINX_IMAGE="$(hack/nginx-base-image.sh)"
          RUNNER_IMAGE="${REGISTRY}/e2e-test-runner:$(cat images/test-runner/TAG)"

          # Prints "true" when the image has to be published.
          plan() {
            local name=$1 ref=$2 platforms=$3 rc=0
            if [ "${IMAGES}" != "all" ] && [ "${IMAGES}" != "${name}" ]; then
              echo false; return
            fi
            # shellcheck disable=SC2086 # platforms is a space separated list
            tools/image-exists.sh "${ref}" ${platforms} || rc=$?
            case ${rc} in
              0) echo "::notice::${ref} is already published, skipping" >&2; echo false ;;
              1) echo true ;;
              3) echo "::error::${ref} is published without all of: ${platforms}. Published tags are immutable; bump the TAG to add a platform." >&2; exit 1 ;;
              *) exit 1 ;;
            esac
          }

          NGINX=$(plan nginx "${NGINX_IMAGE}" "${PLATFORMS}")
          RUNNER=$(plan test-runner "${RUNNER_IMAGE}" linux/amd64)

          {
            echo "nginx=${NGINX}"
            echo "nginx-image=${NGINX_IMAGE}"
            echo "test-runner=${RUNNER}"
            echo "test-runner-image=${RUNNER_IMAGE}"
            echo "platforms=${PLATFORMS// /,}"
            echo "matrix=${MATRIX}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "| Image | Reference | Publish |"
            echo "|---|---|---|"
            echo "| nginx | \`${NGINX_IMAGE}\` | ${NGINX} |"
            echo "| test-runner | \`${RUNNER_IMAGE}\` | ${RUNNER} |"
            echo
            echo "Platforms: \`${PLATFORMS}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  nginx-build:
    name: NGINX / ${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.nginx == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          version: latest

      - name: Login to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        run: |
          make -C images/nginx push-by-digest \
            REGISTRY="${REGISTRY}" \
            PLATFORMS="${{ matrix.platform }}" \
            BUILDX_ARGS="--sbom=true --provenance=mode=max" \
            METADATA_FILE="${RUNNER_TEMP}/metadata.json"

          DIGEST=$(jq -r '."containerimage.digest"' "${RUNNER_TEMP}/metadata.json")
          case "${DIGEST}" in sha256:*) ;; *) echo "::error::no digest in buildx metadata"; exit 1 ;; esac
          mkdir -p "${RUNNER_TEMP}/digests"
          echo "${DIGEST}" > "${RUNNER_TEMP}/digests/${{ matrix.arch }}"
          echo "${{ matrix.platform }}: ${DIGEST}"

      - name: Upload digest
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: nginx-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  nginx-publish:
    name: NGINX / publish
    needs:
      - plan
      - nginx-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nginx-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          version: latest

      - name: Login to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Create multi-platform tag
        id: publish
        env:
          # Not IMAGE: the Makefiles read IMAGE (repository without tag) from the environment.
          REF: ${{ needs.plan.outputs.nginx-image }}
        run: |
          # Re-check right before tagging: never overwrite a published tag.
          rc=0; tools/image-exists.sh "${REF}" || rc=$?
          if [ ${rc} -ne 1 ]; then echo "::error::${REF} already exists or registry query failed (rc=${rc})"; exit 1; fi

          make -C images/nginx manifest \
            REGISTRY="${REGISTRY}" \
            DIGESTS="$(cat "${RUNNER_TEMP}"/digests/* | tr '\n' ' ')"

          DIGEST=$(docker buildx imagetools inspect "${REF}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Published \`${REF}@${DIGEST}\` (${{ needs.plan.outputs.platforms }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Sign
        run: cosign sign --yes "${{ needs.plan.outputs.nginx-image }}@${{ steps.publish.outputs.digest }}"

  test-runner:
    name: Test runner
    needs:
      - plan
      - nginx-publish
    # Runs after the NGINX base when both are published, or alone when only the runner is new.
    if: |
      always() &&
      needs.plan.outputs.test-runner == 'true' &&
      (needs.nginx-publish.result == 'success' || needs.nginx-publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          version: latest

      - name: Login to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build and push
        env:
          # Not IMAGE: the Makefiles read IMAGE (repository without tag) from the environment.
          REF: ${{ needs.plan.outputs.test-runner-image }}
          # CI tooling: amd64 only (GitHub-hosted CI runs on amd64).
          PLATFORMS: linux/amd64
        run: |
          # The runner is built FROM the NGINX base, which must provide every platform.
          # shellcheck disable=SC2086 # one argument per platform
          tools/image-exists.sh "$(hack/nginx-base-image.sh)" ${PLATFORMS//,/ }

          make -C images/test-runner push REGISTRY="${REGISTRY}" PLATFORMS="${PLATFORMS}"

          DIGEST=$(docker buildx imagetools inspect "${REF}" --format '{{json .Manifest}}' | jq -r .digest)
          cosign sign --yes "${REF}@${DIGEST}"
          echo "Published \`${REF}@${DIGEST}\` (${PLATFORMS})" >> "$GITHUB_STEP_SUMMARY"
