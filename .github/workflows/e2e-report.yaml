#
# Publish the junit reports of the e2e jobs of a CI run as check runs.
name: E2E report

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  report:
    name: Report
    if: github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: write
      contents: read
    steps:
      - name: Publish e2e reports
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          artifact: /e2e-test-reports-(.*)/
          name: E2E tests ($1)
          path: '*.xml'
          reporter: java-junit
          fail-on-empty: 'false'
