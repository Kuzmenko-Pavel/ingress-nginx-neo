# SPDX-License-Identifier: Apache-2.0
#
# Trivy scan (fixable vulnerabilities) of the images of the latest release,
# weekly and after every release; one code-scanning category per image.
name: Security

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.plan.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Images
        id: plan
        run: echo "images=$(make -s print-scan-images)" >> "$GITHUB_OUTPUT"

  scan:
    name: Scan ${{ matrix.image }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan
        run: make security-container-scan SCAN_IMAGES=${{ matrix.image }}

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@b1bff81932f5cdfc8695c7752dcee935dcd061c8 # v4.33.0
        with:
          sarif_file: dist/sarif/${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}
