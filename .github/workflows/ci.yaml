name: CI

on:
  # No path filters for pull requests: the 'CI result' job must always report because it
  # is a required status check. The 'changes' job decides which jobs actually run.
  pull_request:
    branches:
      - "*"

  push:
    branches:
      - main
      - release-*
    paths-ignore:
      - 'docs/**'
      - 'deploy/**'
      - '**.md'
      - 'images/**' # Images changes should be tested on their own workflow

  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Force e2e to run'
        required: false
        type: boolean


permissions:
  contents: read

# A new push to a pull request supersedes the previous run; runs on main / release-* are
# never cancelled so every merged commit gets a full result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  changes:
    permissions:
      contents: read  # for dorny/paths-filter to fetch a list of changed files
      pull-requests: read  # for dorny/paths-filter to read pull requests
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      charts: ${{ steps.filter.outputs.charts }}
      baseimage: ${{ steps.filter.outputs.baseimage }}
      baseimagesrc: ${{ steps.filter.outputs.baseimagesrc }}
      baseimagetag: ${{ steps.filter.outputs.baseimagetag }}
      docs: ${{ steps.filter.outputs.docs }}
      lua: ${{ steps.filter.outputs.lua }}
      ci: ${{ steps.filter.outputs.ci }}

    steps:

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'rootfs/**/*'
              - 'TAG'
              - 'test/e2e/**/*'
              - 'hack/nginx-base-image.sh'
            charts:
              - 'charts/ingress-nginx/Chart.yaml'
              - 'charts/ingress-nginx/**/*'
            baseimage:
              - 'images/nginx/**'
              - 'hack/nginx-base-image.sh'
            baseimagesrc:
              - 'images/nginx/rootfs/**'
            baseimagetag:
              - 'images/nginx/TAG'
            docs:
              - '**/*.md'
            lua:
              - '**/*.lua'
            # Changes to the pipeline itself run every job.
            ci:
              - '.github/workflows/ci.yaml'
              - '.github/workflows/zz-tmpl-k8s-e2e.yaml'
              - '.github/actions/setup-kind/**'
              - 'Makefile'
              - 'build/**'
              - 'hack/nginx-base-image.sh'
              - 'hack/image-exists.sh'

  base-image-tag:
    name: NGINX base / tag bump
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.baseimagesrc == 'true'
    steps:
      # Published base image tags are immutable (see hack/nginx-base-image.sh), so a change
      # to the image sources must come with a new images/nginx/TAG.
      - name: Require images/nginx/TAG bump
        if: needs.changes.outputs.baseimagetag != 'true'
        run: |
          echo "::error::images/nginx/rootfs changed but images/nginx/TAG was not bumped"
          exit 1

  lua-lint:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.lua == 'true' || needs.changes.outputs.ci == 'true' || inputs.run_e2e
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
      - name: Lint Lua
        uses: lunarmodules/luacheck@v1
        with:
          args: --codes --globals lua_ingress --globals configuration --globals balancer --globals monitor --globals certificate --globals tcp_udp_configuration --globals tcp_udp_balancer --no-max-comment-line-length -q rootfs/etc/nginx/lua/

  test-go:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.ci == 'true' || inputs.run_e2e
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get go version
        run: echo "GOLANG_VERSION=$(cat GOLANG_VERSION)" >> $GITHUB_ENV

      - name: Set up Go
        id: go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}
          check-latest: true

      - name: Run test
        run: make test

        
  verify-docs:
    name: Verify Doc generation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.ci == 'true' || inputs.run_e2e
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Get go version
        run: echo "GOLANG_VERSION=$(cat GOLANG_VERSION)" >> $GITHUB_ENV
      - name: Set up Go
        id: go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}
          check-latest: true
      - name: Verify Docs
        run: make verify-docs

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: changes
    outputs:
      golangversion: ${{ steps.golangversion.outputs.version }}
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.charts == 'true' || needs.changes.outputs.baseimage == 'true' || needs.changes.outputs.ci == 'true' || inputs.run_e2e

    env:
        PLATFORMS: linux/amd64
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get go version
        id: golangversion
        run: |
          echo "version=$(cat GOLANG_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        id: go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: ${{ steps.golangversion.outputs.version }}
          check-latest: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          version: latest

      - name: Available platforms
        run: echo ${{ steps.buildx.outputs.platforms }}

      - name: Prepare Host
        run: |
          curl -LO https://dl.k8s.io/release/v1.35.3/bin/linux/amd64/kubectl
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl

      - name: Resolve NGINX base image
        id: base
        run: |
          BASE_IMAGE="$(hack/nginx-base-image.sh)"
          echo "image=${BASE_IMAGE}" >> "$GITHUB_OUTPUT"

          # Build the base from source when it changed or is not published yet (e.g. a new
          # images/nginx/TAG before the Base Images workflow ran); otherwise pull it.
          if [ "${{ needs.changes.outputs.baseimage }}" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            rc=0; hack/image-exists.sh "${BASE_IMAGE}" || rc=$?
            case ${rc} in
              0) echo "build=false" >> "$GITHUB_OUTPUT" ;;
              1) echo "build=true" >> "$GITHUB_OUTPUT" ;;
              *) exit 1 ;;
            esac
          fi

      - name: Build NGINX Base image
        if: steps.base.outputs.build == 'true'
        run: |
          cd images/nginx/rootfs && docker buildx build --platform=${{ env.PLATFORMS }} --load -t "${{ steps.base.outputs.image }}" .

      - name: Build images
        env:
          TAG: 1.0.0-dev
          ARCH: amd64
          REGISTRY: ingress-controller
          # Use the local docker image store so a locally built base image is picked up.
          BUILDX_BUILDER: default
        run: |
          echo "building images..."
          make BASE_IMAGE="${{ steps.base.outputs.image }}" clean-image build image image-chroot
          make -C test/e2e-image image
          # The chart's default kube-webhook-certgen image (values.yaml) may not be published yet;
          # build it from this revision so the chart tests use it (run-chart-test.sh loads it).
          make -C images build NAME=kube-webhook-certgen PLATFORMS=linux/amd64 OUTPUT=--load

          echo "creating images cache..."
          CERTGEN_IMAGE="ghcr.io/kuzmenko-pavel/ingress-nginx/kube-webhook-certgen:$(cat images/kube-webhook-certgen/TAG)"
          IMAGES="nginx-ingress-controller:e2e ingress-controller/controller:1.0.0-dev ingress-controller/controller-chroot:1.0.0-dev ${CERTGEN_IMAGE}"
          if [ "${{ steps.base.outputs.build }}" = "true" ]; then
            # Not published yet: ship it to the e2e jobs, run-kind-e2e.sh loads it into kind.
            IMAGES="${IMAGES} ${{ steps.base.outputs.image }}"
          fi
          # shellcheck disable=SC2086 # IMAGES is a space separated list
          docker save ${IMAGES} | gzip > docker.tar.gz

      - name: cache
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: docker.tar.gz
          path: docker.tar.gz
          retention-days: 5

  chart-lint:
    name: Chart / Lint
    runs-on: ubuntu-latest
    needs:
      - changes

    if: needs.changes.outputs.charts == 'true' || needs.changes.outputs.baseimage == 'true' || needs.changes.outputs.ci == 'true' || inputs.run_e2e

    steps:
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.x

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.1.3

      - name: Set up Helm Chart Testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f

      - name: Set up Artifact Hub
        run: |
          curl --fail --location https://github.com/artifacthub/hub/releases/download/v1.20.0/ah_1.20.0_linux_amd64.tar.gz --output /tmp/ah.tar.gz
          echo "9027626f19ff9f3ac668f222917130ac885e289e922e1428bfd2e7f066324e31  /tmp/ah.tar.gz" | shasum --check
          sudo tar --extract --file /tmp/ah.tar.gz --directory /usr/local/bin ah

      - name: Set up Helm Docs
        uses: gabe565/setup-helm-docs-action@d5c35bdc9133cfbea3b671acadf50a29029e87c2 # v1.0.4

      - name: Set up Helm Unit Test
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --verify=false

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Lint chart
        run: |
          ct lint --config .ct.yaml
          ah lint --path charts/ingress-nginx

      - name: Check docs
        run: |
          helm-docs --chart-search-root charts
          git diff --exit-code charts/ingress-nginx/README.md

      - name: Run tests
        run: helm unittest charts/ingress-nginx --file "tests/**/*_test.yaml"

  chart-test:
    name: Chart / Test
    runs-on: ubuntu-latest
    needs:
      - changes
      - build
      - chart-lint

    if: needs.changes.outputs.charts == 'true' || needs.changes.outputs.baseimage == 'true' || needs.changes.outputs.ci == 'true' || inputs.run_e2e

    strategy:
      fail-fast: false
      matrix:
        k8s: [v1.34.11, v1.35.8, v1.36.4]

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up kind
        uses: ./.github/actions/setup-kind

      - name: Download cache
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker.tar.gz

      - name: Load cache
        run: gzip --decompress --stdout docker.tar.gz | docker load

      - name: Run tests
        env:
          K8S_VERSION: ${{ matrix.k8s }}
          SKIP_IMAGE_CREATION: true
        run: |
          sudo mkdir -pm 777 "${HOME}/.kube"
          make kind-e2e-chart-tests

  kubernetes:
    name: Kubernetes
    needs:
      - changes
      - build
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.baseimage == 'true' || needs.changes.outputs.ci == 'true' || inputs.run_e2e
    strategy:
      fail-fast: false
      matrix:
        k8s: [v1.34.11, v1.35.8, v1.36.4]
    uses: ./.github/workflows/zz-tmpl-k8s-e2e.yaml
    with:
      k8s-version: ${{ matrix.k8s }}

  kubernetes-chroot:
    name: Kubernetes chroot
    needs:
      - changes
      - build
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.baseimage == 'true' || needs.changes.outputs.ci == 'true' || inputs.run_e2e
    strategy:
      fail-fast: false
      matrix:
        k8s: [v1.34.11, v1.35.8, v1.36.4]
    uses: ./.github/workflows/zz-tmpl-k8s-e2e.yaml
    with:
      k8s-version: ${{ matrix.k8s }}
      variation: "CHROOT"

  # Single required status check for branch protection. Runs even when the path filters
  # skipped every other job, and fails if any job failed or was cancelled; skipped jobs count
  # as passed. It does not run when the whole workflow run was cancelled (e.g. superseded by
  # a newer push), so a superseded run does not report a failure.
  result:
    name: CI result
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    needs:
      - changes
      - base-image-tag
      - lua-lint
      - test-go
      - verify-docs
      - build
      - chart-lint
      - chart-test
      - kubernetes
      - kubernetes-chroot
    steps:
      - name: Check CI results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "${RESULTS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "${RESULTS}" | jq -e 'to_entries | any(.value.result == "failure" or .value.result == "cancelled")' > /dev/null; then
            echo "::error::at least one job failed or was cancelled"
            exit 1
          fi
