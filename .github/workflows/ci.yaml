# SPDX-License-Identifier: Apache-2.0
#
# Checks of pull requests, main and release branches. Every step calls a make
# target; "CI result" is the single required check. A push to main publishes
# the latest channel (images, chart, plugin artifact, docs) after it passes.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - release-*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      lua: ${{ steps.filter.outputs.lua }}
      template: ${{ steps.filter.outputs.template }}
      chart: ${{ steps.filter.outputs.chart }}
      images-deps: ${{ steps.filter.outputs.images-deps }}
      images-delivered: ${{ steps.filter.outputs.images-delivered }}
      certgen: ${{ steps.filter.outputs.certgen }}
      docs: ${{ steps.filter.outputs.docs }}
      ci: ${{ steps.filter.outputs.ci }}
      k8s-versions: ${{ steps.matrix.outputs.k8s-versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            go:
              - '**/*.go'
              - '**/go.mod'
              - '**/go.sum'
            lua:
              - 'rootfs/etc/nginx/lua/**'
            template:
              - 'rootfs/**'
            chart:
              - 'charts/**'
              - 'tools/manifest-templates/**'
              - 'tools/generate-manifests.sh'
            images-deps:
              - 'images/nginx/**'
              - 'images/test-runner/**'
              - 'images/e2e-test-echo/**'
              - 'images/httpbun/**'
              - 'images/fastcgi-helloserver/**'
              - 'images/cfssl/**'
            images-delivered:
              - 'rootfs/**'
              - 'images/kube-webhook-certgen/**'
              - 'images/custom-error-pages/**'
            certgen:
              - 'images/kube-webhook-certgen/**'
              - 'tools/e2e-certgen.sh'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'charts/**'
            ci:
              - '.github/**'
              - 'Makefile'
              - 'tools/**'
              - 'test/**'

      - name: Kubernetes versions
        id: matrix
        run: echo "k8s-versions=$(make -s print-k8s-versions)" >> "$GITHUB_OUTPUT"

  deps:
    name: Dependency images
    needs: changes
    uses: ./.github/workflows/deps.yaml
    permissions:
      contents: read
      packages: write
    with:
      publish: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}

  lint:
    name: Lint
    needs: [changes, deps]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Cache tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/**/go.sum', 'tools/**/go.mod', 'tools/versions.env', 'go.mod') }}

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download dependency images
        if: needs.deps.outputs.artifact == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deps-images
          path: dist

      - name: Lint
        run: make docker-load code-lint

      - name: Conventional Commits
        if: github.event_name == 'pull_request'
        run: make code-lint-commits BASE=${{ github.event.pull_request.base.sha }}

  unit:
    name: Unit tests
    needs: [changes, deps]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download dependency images
        if: needs.deps.outputs.artifact == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deps-images
          path: dist

      - name: Go and Lua unit tests
        run: make docker-load test-unit test-unit-lua

  generated:
    name: Generated files
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Cache tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/**/go.sum', 'tools/**/go.mod', 'tools/versions.env', 'go.mod') }}

      - name: Verify generated docs
        run: make docs-verify helm-docs-verify

  helm:
    name: Helm chart
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/**/go.sum', 'tools/**/go.mod', 'tools/versions.env', 'go.mod') }}

      - name: Lint and unit test the chart
        run: make helm-lint helm-test

  docs:
    name: Docs
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Build the site
        run: make docs-build

  security:
    name: Dependency scan
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Cache tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/**/go.sum', 'tools/**/go.mod', 'tools/versions.env', 'go.mod') }}

      - name: govulncheck
        run: make security-dependency-scan

  build:
    name: Build images
    needs: [changes, deps]
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.go == 'true' || needs.changes.outputs.lua == 'true' ||
      needs.changes.outputs.template == 'true' || needs.changes.outputs.chart == 'true' ||
      needs.changes.outputs.images-deps == 'true' || needs.changes.outputs.images-delivered == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      BUILDX_BUILDER: default
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Cache tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/**/go.sum', 'tools/**/go.mod', 'tools/versions.env', 'go.mod') }}

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download dependency images
        if: needs.deps.outputs.artifact == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deps-images
          path: dist

      - name: Build the delivered and e2e images
        run: >-
          make docker-load docker-build docker-build-e2e docker-save
          SAVE="controller controller-chroot kube-webhook-certgen custom-error-pages e2e"

      - name: Upload images
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: images
          path: dist/images-*.tar
          retention-days: 3

  e2e:
    name: E2E (${{ matrix.variant }}, ${{ matrix.k8s.name }})
    needs: [changes, deps, build]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        k8s: ${{ fromJSON(needs.changes.outputs.k8s-versions) }}
        variant: [default, chroot]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/**/go.sum', 'tools/**/go.mod', 'tools/versions.env', 'go.mod') }}

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download dependency images
        if: needs.deps.outputs.artifact == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deps-images
          path: dist

      - name: Download images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: images
          path: dist

      - name: Run e2e
        run: >-
          make docker-load test-e2e SKIP_BUILD=1
          K8S_VERSION=${{ matrix.k8s.version }} E2E_VARIANT=${{ matrix.variant }}

      - name: Upload junit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: e2e-test-reports-${{ matrix.variant }}-${{ matrix.k8s.name }}
          path: test/junitreports/*.xml
          if-no-files-found: ignore
          retention-days: 7

  e2e-chart:
    name: Chart e2e (${{ matrix.k8s.name }})
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        k8s: ${{ fromJSON(needs.changes.outputs.k8s-versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/**/go.sum', 'tools/**/go.mod', 'tools/versions.env', 'go.mod') }}

      - name: Download images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: images
          path: dist

      - name: Install the chart for every CI values file
        run: make docker-load test-e2e-chart SKIP_BUILD=1 K8S_VERSION=${{ matrix.k8s.version }}

  e2e-certgen:
    name: kube-webhook-certgen e2e
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.certgen == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Cache tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/**/go.sum', 'tools/**/go.mod', 'tools/versions.env', 'go.mod') }}

      - name: Run the certgen e2e
        run: make test-e2e-certgen

  # The single required status check. Skipped jobs count as passed; it does not
  # run when the whole workflow run was cancelled (e.g. superseded).
  result:
    name: CI result
    if: ${{ !cancelled() }}
    needs: [changes, deps, lint, unit, generated, helm, docs, security, build, e2e, e2e-chart, e2e-certgen]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: make ci-result

  publish-latest:
    name: Publish latest
    needs: result
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' && needs.result.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: publish-latest
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Cache tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/**/go.sum', 'tools/**/go.mod', 'tools/versions.env', 'go.mod') }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish images and chart
        run: >-
          make publish-guard docker-publish docker-promote docker-sign helm-package helm-publish
          CHANNEL=latest DOCKER_CACHE=gha

      - name: Build the kubectl plugin
        run: make code-build-plugin CHANNEL=latest

      - name: Upload the kubectl plugin
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: kubectl-plugin
          path: dist/plugin
          retention-days: 7

  docs-latest:
    name: Publish docs (latest)
    needs: publish-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Publish the latest docs version
        run: make docs-publish CHANNEL=latest
