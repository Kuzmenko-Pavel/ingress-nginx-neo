# SPDX-License-Identifier: Apache-2.0
#
# Checks of pull requests, main and release branches. Every step calls a make
# target; "CI result" is the single required check. A push to main publishes
# the latest channel (images, chart, plugin artifact, docs) after it passes.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - release-*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      lua: ${{ steps.filter.outputs.lua }}
      template: ${{ steps.filter.outputs.template }}
      chart: ${{ steps.filter.outputs.chart }}
      images-deps: ${{ steps.filter.outputs.images-deps }}
      images-delivered: ${{ steps.filter.outputs.images-delivered }}
      certgen: ${{ steps.filter.outputs.certgen }}
      docs: ${{ steps.filter.outputs.docs }}
      e2e: ${{ steps.filter.outputs.e2e }}
      build-system: ${{ steps.filter.outputs.build-system }}
      workflow: ${{ steps.filter.outputs.workflow }}
      k8s-versions: ${{ steps.matrix.outputs.k8s-versions }}
      e2e-variants: ${{ steps.matrix.outputs.e2e-variants }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            go:
              - '**/*.go'
              - '**/go.mod'
              - '**/go.sum'
            lua:
              - 'rootfs/etc/nginx/lua/**'
            template:
              - 'rootfs/**'
            chart:
              - 'charts/**'
              - 'make/helm.mk'
              - 'make/manifests.mk'
              - 'tools/manifest-templates/**'
              - 'tools/generate-manifests.sh'
            images-deps:
              - 'images/nginx/**'
              - 'images/test-runner/**'
              - 'images/e2e-test-echo/**'
              - 'images/httpbun/**'
              - 'images/fastcgi-helloserver/**'
              - 'images/cfssl/**'
            images-delivered:
              - 'rootfs/**'
              - 'images/kube-webhook-certgen/**'
              - 'images/custom-error-pages/**'
            certgen:
              - 'images/kube-webhook-certgen/**'
              - 'tools/e2e-certgen.sh'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'charts/**'
              - 'make/docs.mk'
              - 'tools/docs/**'
              - 'tools/docs-publish.sh'
            # The e2e suite, its image and the scripts that build or run it.
            e2e:
              - 'test/**'
              - 'make/test.mk'
              - 'make/images.mk'
              - 'tools/content-tag.sh'
              - 'tools/image-exists.sh'
              - 'tools/e2e-chart.sh'
            # Shared variables, pinned tools and the Go build of the Makefile.
            build-system:
              - 'Makefile'
              - 'make/code.mk'
              - 'tools/go.mod'
              - 'tools/go.sum'
              - 'tools/versions.env'
              - 'tools/install.sh'
              - 'tools/actionlint/**'
            # Any workflow change runs the whole CI.
            workflow:
              - '.github/**'

      # Pull requests run e2e on the newest Kubernetes version, pushes, manual
      # runs and pull requests labeled full-e2e on every version.
      - name: Test matrices
        id: matrix
        env:
          FULL: >-
            ${{ github.event_name != 'pull_request'
                || contains(github.event.pull_request.labels.*.name, 'full-e2e') }}
        run: |
          if [ "$FULL" = true ]; then
            echo "k8s-versions=$(make -s print-k8s-versions)" >> "$GITHUB_OUTPUT"
          else
            echo "k8s-versions=$(make -s print-k8s-versions-pr)" >> "$GITHUB_OUTPUT"
          fi
          echo "e2e-variants=$(make -s print-e2e-variants)" >> "$GITHUB_OUTPUT"

  deps:
    name: Dependency images
    needs: changes
    uses: ./.github/workflows/deps.yaml
    permissions:
      contents: read
      packages: write
    with:
      publish: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}

  lint:
    name: Lint
    needs: [changes, deps]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Cache tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/**/go.sum', 'tools/**/go.mod', 'tools/versions.env', 'go.mod') }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download dependency images
        if: needs.deps.outputs.artifact == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deps-images
          path: dist

      - name: Lint
        run: make docker-load code-lint

      - name: Conventional Commits
        if: github.event_name == 'pull_request'
        run: make code-lint-commits BASE=${{ github.event.pull_request.base.sha }}

  unit:
    name: Unit tests
    needs: [changes, deps]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download dependency images
        if: needs.deps.outputs.artifact == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deps-images
          path: dist

      - name: Go and Lua unit tests
        run: make docker-load test-unit test-unit-lua

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-unit
          path: dist/test-reports
          if-no-files-found: ignore
          retention-days: 7

  generated:
    name: Generated files
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Cache tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/**/go.sum', 'tools/**/go.mod', 'tools/versions.env', 'go.mod') }}

      - name: Verify generated docs
        run: make docs-verify helm-docs-verify

  helm:
    name: Helm chart
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/**/go.sum', 'tools/**/go.mod', 'tools/versions.env', 'go.mod') }}

      - name: Lint and unit test the chart
        run: make helm-lint helm-test

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-helm
          path: dist/test-reports
          if-no-files-found: ignore
          retention-days: 7

  docs:
    name: Docs
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.docs == 'true' || needs.changes.outputs.build-system == 'true' ||
      needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Build the site
        run: make docs-build

      - name: Check the docs publication
        run: make docs-publish-check

  security:
    name: Dependency scan
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Cache tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/**/go.sum', 'tools/**/go.mod', 'tools/versions.env', 'go.mod') }}

      - name: govulncheck
        run: make security-dependency-scan

  build:
    name: Build images
    needs: [changes, deps]
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.go == 'true' || needs.changes.outputs.lua == 'true' ||
      needs.changes.outputs.template == 'true' || needs.changes.outputs.chart == 'true' ||
      needs.changes.outputs.images-deps == 'true' || needs.changes.outputs.images-delivered == 'true' ||
      needs.changes.outputs.e2e == 'true' || needs.changes.outputs.build-system == 'true' ||
      needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      BUILDX_BUILDER: default
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Cache tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/**/go.sum', 'tools/**/go.mod', 'tools/versions.env', 'go.mod') }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download dependency images
        if: needs.deps.outputs.artifact == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deps-images
          path: dist

      - name: Build the delivered and e2e images
        run: >-
          make docker-load docker-build docker-build-e2e docker-save
          SAVE="controller controller-chroot kube-webhook-certgen custom-error-pages e2e"

      - name: Upload images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: dist/images-*.tar
          retention-days: 3

  e2e:
    name: E2E (${{ matrix.variant }}, ${{ matrix.k8s.name }})
    needs: [changes, deps, build]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        k8s: ${{ fromJSON(needs.changes.outputs.k8s-versions) }}
        variant: ${{ fromJSON(needs.changes.outputs.e2e-variants) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/**/go.sum', 'tools/**/go.mod', 'tools/versions.env', 'go.mod') }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download dependency images
        if: needs.deps.outputs.artifact == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deps-images
          path: dist

      - name: Download images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: dist

      - name: Run e2e
        run: >-
          make docker-load test-e2e SKIP_BUILD=1
          K8S_VERSION=${{ matrix.k8s.version }} E2E_VARIANT=${{ matrix.variant }}

      - name: Upload junit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-reports-${{ matrix.variant }}-${{ matrix.k8s.name }}
          path: test/junitreports/*.xml
          if-no-files-found: ignore
          retention-days: 7

  e2e-chart:
    name: Chart e2e (${{ matrix.k8s.name }})
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        k8s: ${{ fromJSON(needs.changes.outputs.k8s-versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/**/go.sum', 'tools/**/go.mod', 'tools/versions.env', 'go.mod') }}

      - name: Download images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: dist

      - name: Install the chart for every CI values file
        run: make docker-load test-e2e-chart SKIP_BUILD=1 K8S_VERSION=${{ matrix.k8s.version }}

  e2e-certgen:
    name: kube-webhook-certgen e2e
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.certgen == 'true' || needs.changes.outputs.e2e == 'true' ||
      needs.changes.outputs.build-system == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Cache tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/**/go.sum', 'tools/**/go.mod', 'tools/versions.env', 'go.mod') }}

      - name: Run the certgen e2e
        run: make test-e2e-certgen

  # The single required status check. Skipped jobs count as passed; it does not
  # run when the whole workflow run was cancelled (e.g. superseded).
  result:
    name: CI result
    if: ${{ !cancelled() }}
    needs: [changes, deps, lint, unit, generated, helm, docs, security, build, e2e, e2e-chart, e2e-certgen]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: make ci-result

  publish-latest:
    name: Publish latest
    needs: result
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' && needs.result.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: publish-latest
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Cache tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/**/go.sum', 'tools/**/go.mod', 'tools/versions.env', 'go.mod') }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # After a newer merge into main, its own run publishes latest.
      - name: Check the tip of main
        id: tip
        run: |
          tip="$(make -s print-main-tip)"
          echo "tip=$tip" >> "$GITHUB_OUTPUT"
          [ "$tip" = true ] || echo "::notice::A newer commit of main publishes latest, skipped"

      - name: Publish images and chart
        if: steps.tip.outputs.tip == 'true'
        run: >-
          make docker-publish docker-promote docker-sign helm-package helm-publish
          CHANNEL=latest DOCKER_CACHE=gha

      - name: Build the kubectl plugin
        if: steps.tip.outputs.tip == 'true'
        run: make code-build-plugin CHANNEL=latest

      - name: Upload the kubectl plugin
        if: steps.tip.outputs.tip == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kubectl-plugin
          path: dist/plugin
          retention-days: 7

  docs-latest:
    name: Publish docs (latest)
    needs: publish-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Check the tip of main
        id: tip
        run: |
          tip="$(make -s print-main-tip)"
          echo "tip=$tip" >> "$GITHUB_OUTPUT"
          [ "$tip" = true ] || echo "::notice::A newer commit of main publishes the latest docs, skipped"

      - name: Publish the latest docs version
        if: steps.tip.outputs.tip == 'true'
        run: make docs-publish CHANNEL=latest
